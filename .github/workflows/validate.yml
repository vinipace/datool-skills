name: Validate skills

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: node scripts/validate.mjs
      - name: Verify advertised commands against the published npm CLI
        run: node scripts/test-cli-distribution.mjs 0.2.0
      - name: Verify installer discovery
        env:
          DISABLE_TELEMETRY: "1"
        run: npx --yes skills@1.5.25 add ./skills --list
